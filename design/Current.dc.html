<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #7c3aed; } a:hover { color: #6830c8; }
    .ttl { font-family: "Gowun Batang", serif; }
  </style>
</helmet>

<div style="display: flex; flex-direction: column; gap: 22px; padding: 34px 34px; background: #f5f0fc; min-height: 100%; box-sizing: border-box">

  <div style="display: flex; flex-direction: column; gap: 7px">
    <div style="font-size: 10px; font-weight: 900; letter-spacing: 2px; color: #e0455f">WHAT WENT WRONG</div>
    <div class="ttl" style="font-size: 25px; font-weight: 700; letter-spacing: -0.8px; color: #1a0f2e">지난 시안 — 고양이로 읽혀요</div>
  </div>

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <linearGradient id="tileO" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(15)">
        <stop offset="0" stop-color="#3a1266"></stop>
        <stop offset="1" stop-color="#1c0733"></stop>
      </linearGradient>
    </defs>
    <symbol id="icO" viewBox="0 0 192 192">
      <rect width="192" height="192" rx="44" fill="url(#tileO)"></rect>
      <g transform="rotate(158.96 96 106.46)">
        <circle cx="96" cy="106.46" r="60" fill="none" stroke="#6b4a9e" stroke-width="11" stroke-linecap="round" stroke-dasharray="232.6 144.4"></circle>
        <circle cx="96" cy="106.46" r="60" fill="none" stroke="#e8d18a" stroke-width="11" stroke-linecap="round" stroke-dasharray="128 249"></circle>
      </g>
      <g transform="translate(96,106.46) scale(0.92) translate(-96,-106.46)">
        <g fill="#ffffff">
          <path transform="rotate(-13 79 76)" d="M79,54 C90,64 93,86 90,100 C88,110 70,110 68,100 C65,86 68,64 79,54 Z"></path>
          <path transform="rotate(13 113 76)" d="M113,54 C124,64 127,86 124,100 C122,110 104,110 102,100 C99,86 102,64 113,54 Z"></path>
        </g>
        <g fill="#cdbcf5">
          <path transform="rotate(-13 79 76)" d="M79,69 C86,77 88,90 86,98 C84,104 74,104 72,98 C70,90 72,77 79,69 Z"></path>
          <path transform="rotate(13 113 76)" d="M113,69 C120,77 122,90 120,98 C118,104 108,104 106,98 C104,90 106,77 113,69 Z"></path>
        </g>
        <path fill="#ffffff" d="M96,78 C75,78 61,92 59,110 C57,128 62,142 75,148 C83,152 109,152 117,148 C130,142 135,128 133,110 C131,92 117,78 96,78 Z"></path>
        <g fill="#25093f">
          <rect x="61" y="93" width="32" height="21" rx="7" transform="rotate(-3 77 103)"></rect>
          <rect x="99" y="93" width="32" height="21" rx="7" transform="rotate(3 115 103)"></rect>
          <rect x="91" y="99" width="10" height="6" rx="2"></rect>
          <path d="M96,125 L90,117 L102,117 Z"></path>
        </g>
        <path d="M108,130 C104,140 92,144 84,138 C80,135 78,130 80,124" fill="none" stroke="#25093f" stroke-width="6" stroke-linecap="round"></path>
      </g>
      <path d="M134,74 L137.2,80.8 L144,84 L137.2,87.2 L134,94 L130.8,87.2 L124,84 L130.8,80.8 Z" fill="#e8d18a"></path>
    </symbol>
  </svg>

  <div style="display: flex; align-items: flex-end; gap: 24px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <svg viewBox="0 0 192 192" width="150" height="150"><use href="#icO"></use></svg>
      <div style="font-size: 11px; color: #786b9c">192</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <svg viewBox="0 0 192 192" width="32" height="32"><use href="#icO"></use></svg>
      <div style="font-size: 11px; color: #786b9c">32</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px; font-size: 12px; line-height: 1.7; color: #6b5f8a">
    <div style="display: flex; gap: 10px">
      <span style="flex: none; width: 15px; font-weight: 800; color: #e0455f">1</span>
      <span><strong style="color: #1a0f2e">귀가 짧고 넓고 벌어졌어요.</strong> 길이 52 · 폭 22 · 간격 34 — 고양이 귀의 비율이에요.</span>
    </div>
    <div style="display: flex; gap: 10px">
      <span style="flex: none; width: 15px; font-weight: 800; color: #e0455f">2</span>
      <span><strong style="color: #1a0f2e">머리가 너무 둥글고 넓어요.</strong> 폭 76에 높이 70이라 거의 원이에요.</span>
    </div>
    <div style="display: flex; gap: 10px">
      <span style="flex: none; width: 15px; font-weight: 800; color: #e0455f">3</span>
      <span><strong style="color: #1a0f2e">얼굴이 붐벼요.</strong> 선글라스·코·입이 좁은 자리에 몰려 32px에서 한 덩어리가 돼요.</span>
    </div>
    <div style="display: flex; gap: 10px">
      <span style="flex: none; width: 15px; font-weight: 800; color: #e0455f">4</span>
      <span><strong style="color: #1a0f2e">반짝임이 귀에 붙었어요.</strong> 2px 간격이라 귀의 일부처럼 보여요.</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
