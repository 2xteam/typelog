<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    TypeLog 앱 아이콘 — 「나는 어떤 타입일까?」 말풍선 (2026-11-14, 토끼를 걷어냈다).
    인스타그램 그라디언트 타일 · 흰 말풍선 · 그라디언트 물음표 · 노란 반짝임.
    재밌는 타입 설문이라는 앱의 정체성을 그린다. 자격증 모양은 러닝 기록 결과에만 쓴다.
    16px 은 public/app-icon-16.svg (반짝임을 빼고 물음표를 굵게).
    → my-obsidian-vault / 10-Projects/TypeLog.md
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fa7e1e"/>
      <stop offset=".35" stop-color="#d62976"/>
      <stop offset=".68" stop-color="#962fbf"/>
      <stop offset="1" stop-color="#4f5bd5"/>
    </linearGradient>
    <radialGradient id="glow" cx=".12" cy=".95" r=".55">
      <stop offset="0" stop-color="#feda75" stop-opacity=".85"/>
      <stop offset="1" stop-color="#feda75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#962fbf"/>
      <stop offset="1" stop-color="#d62976"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#tile)"/>
  <rect width="192" height="192" rx="44" fill="url(#glow)"/>

  <!-- 말풍선 — 왼쪽 아래로 꼬리 -->
  <path fill="#2a0f3a" opacity=".22"
        d="M60,46 H136 C152,46 162,56 162,72 V116 C162,132 152,142 136,142 H86 L58,164 L64,142 H60 C44,142 34,132 34,116 V72 C34,56 44,46 60,46 Z"
        transform="translate(3 5)"/>
  <path fill="#ffffff"
        d="M60,46 H136 C152,46 162,56 162,72 V116 C162,132 152,142 136,142 H86 L58,164 L64,142 H60 C44,142 34,132 34,116 V72 C34,56 44,46 60,46 Z"/>

  <!-- 물음표 -->
  <path d="M80,78 C80,66 88,60 98,60 C109,60 117,67 117,77 C117,89 102,91 100,104 L100,108"
        fill="none" stroke="url(#mark)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="127" r="9" fill="#d62976"/>

  <!-- 반짝임 -->
  <path fill="#feda75" d="M150,22 C152,32 156,36 166,38 C156,40 152,44 150,54 C148,44 144,40 134,38 C144,36 148,32 150,22 Z"/>
  <path fill="#ffffff" opacity=".9" d="M170,58 C171,63 173,65 178,66 C173,67 171,69 170,74 C169,69 167,67 162,66 C167,65 169,63 170,58 Z"/>
</svg>
