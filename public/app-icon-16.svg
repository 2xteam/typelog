<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    16px 전용 TypeLog 아이콘.

    app-icon.svg 를 16px 로 줄이면 아무것도 읽히지 않는다 — 게이지 호와 토끼가
    같은 몇 픽셀을 나눠 쓰면서 얼굴이 회색 덩어리가 된다. 32px 에서는 읽힌다.

    그래서 16px 에서는 **버릴 것을 버린다.**
      · 게이지 호 — 지운다. 네 앱의 공통 기하지만 16px 에서는 토끼를 가린다
      · 선글라스 렌즈 두 개 — 하나의 긴 띠로 합친다. 6px 안에 두 칸은 안 나온다
      · 입·반짝임 — 지운다. 1px 선은 회색 점으로만 남는다
    남기는 것은 **한쪽만 접힌 귀와 머리 실루엣**이다. 이게 이 아이콘의 정체다.

    실루엣을 타일 가장자리까지 키운다 — 여백을 두면 실제로 보이는 크기가 더 줄어든다.
    → my-obsidian-vault / 20-Design/앱 공통 UI와 아이콘.md
  -->
  <defs>
    <linearGradient id="tile16" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(15)">
      <stop offset="0" stop-color="#3a1266"/>
      <stop offset="1" stop-color="#1c0733"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#tile16)"/>

  <!-- 원본 기하를 중심에서 1.55배로 키운다 -->
  <g transform="translate(96 96) scale(1.55) translate(-96 -110)">
    <!-- 귀 — 왼쪽 세운 귀, 오른쪽 접힌 귀. 두 귀 모두 굵게 -->
    <g fill="#ffffff">
      <path transform="rotate(-6 84 80)"
            d="M84,54 C90,54 92.5,59 92.5,67 C92.5,80 92,92 91,100
               C89,109 79,109 77,100 C76,92 75.5,80 75.5,67
               C75.5,59 78,54 84,54 Z"/>
      <path d="M103,101 C99,84 103,68 114,63 C126,57 137,64 133,74
               C130,84 117,85 111,93 C108,97 108,99 108,103 Z"/>
    </g>

    <!-- 머리 -->
    <path fill="#ffffff"
          d="M96,97 C75,97 63,109 63,126 C63,143 75,155 96,155
             C117,155 129,143 129,126 C129,109 117,97 96,97 Z"/>

    <!--
      선글라스 — 렌즈 두 개를 하나의 띠로 합친다.
      띠가 얇으면(높이 19) 아래 남는 흰 면적이 커서 머리가 **컵처럼** 보인다.
      아래로 내리고 두껍게(118/31) 해서 흰 면은 턱만큼만 남긴다.
    -->
    <rect x="68" y="118" width="56" height="31" rx="14" fill="#25093f"/>
  </g>
</svg>
